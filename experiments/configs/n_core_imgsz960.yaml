# Experiment 2. One change from n_core_baseline: input size 640 -> 960.
# Hypothesis (from error analysis on the validation split): most missed helmets and vests are
# small objects (<1% of the image), so a larger input should raise their recall.
name: n_core_imgsz960
model: yolo11n.pt
dataset:
  profile: core
  version: d1dc2ab4d1a9
train:
  epochs: 100
  imgsz: 960
  batch: 16
  patience: 30
  workers: 2
  seed: 42
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: visionguard
